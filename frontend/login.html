<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录 / 注册 - 图书知识图谱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 58, 237, .12), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(14, 165, 233, .12), transparent 32%),
        linear-gradient(135deg, #f9f1df 0%, #eff6ff 50%, #f7f3ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      color: #17202a;
      padding: 20px;
    }
    .login-container { width: 100%; max-width: 460px; }
    .login-card {
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 24px;
      padding: 34px 30px;
      box-shadow: 0 24px 80px rgba(39, 32, 18, .14);
    }
    .login-header { text-align: center; margin-bottom: 24px; }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 10px 25px rgba(124, 58, 237, .26);
      font-size: 28px;
      font-weight: 900;
      color: white;
    }
    .login-header h1 { font-size: 1.8rem; font-weight: 800; color: #17202a; margin-bottom: 6px; }
    .login-header p { color: #667085; font-size: .95rem; line-height: 1.6; }
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(255, 255, 255, .68);
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 16px;
      padding: 6px;
      margin-bottom: 16px;
    }
    .tab-btn {
      border: none;
      border-radius: 12px;
      padding: 11px 10px;
      background: transparent;
      color: #667085;
      cursor: pointer;
      font-weight: 800;
      transition: .2s;
    }
    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      box-shadow: 0 10px 22px rgba(14, 165, 233, .18);
    }
    .role-note {
      margin: -4px 0 16px;
      color: #475467;
      background: rgba(124, 58, 237, .08);
      border: 1px solid rgba(124, 58, 237, .12);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: .86rem;
      line-height: 1.6;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: .9rem; font-weight: 700; color: #344054; margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%;
      padding: 14px 46px 14px 16px;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(17, 24, 39, .10);
      border-radius: 12px;
      color: #17202a;
      font-size: 1rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
    }
    .input-wrapper input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124, 58, 237, .16); }
    .input-wrapper input::placeholder { color: #98a2b3; }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #667085;
      font-size: .9rem;
      cursor: pointer;
      padding: 4px;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s;
      margin-top: 10px;
    }
    .submit-btn:hover { box-shadow: 0 10px 20px rgba(124, 58, 237, .28); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: .62; cursor: not-allowed; transform: none; }
    .demo-hint {
      margin-top: 22px;
      text-align: center;
      font-size: .85rem;
      color: #667085;
      border-top: 1px solid rgba(17, 24, 39, .10);
      padding-top: 18px;
      line-height: 1.8;
    }
    .demo-hint code { background: rgba(124, 58, 237, .10); padding: 2px 8px; border-radius: 20px; color: #5b21b6; }
    .message {
      border-radius: 10px;
      padding: 12px;
      font-size: .9rem;
      margin-bottom: 16px;
      display: none;
      line-height: 1.6;
    }
    .message.visible { display: block; }
    .message.error { background: rgba(239, 68, 68, .12); border: 1px solid rgba(239, 68, 68, .28); color: #b42318; }
    .message.success { background: rgba(34, 197, 94, .12); border: 1px solid rgba(34, 197, 94, .28); color: #027a48; }
    .hidden { display: none !important; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #5b21b6; text-decoration: none; font-size: .9rem; }
    .back-link:hover { color: #7c3aed; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">KG</div>
        <h1>用户入口</h1>
      </div>

      <div class="mode-tabs">
        <button type="button" class="tab-btn active" data-mode="login">登录</button>
        <button type="button" class="tab-btn" data-mode="register">注册</button>
      </div>

      <div id="msgBox" class="message"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="loginAccount">用户名 / 邮箱</label>
          <div class="input-wrapper">
            <input type="text" id="loginAccount" placeholder="输入用户名或邮箱" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" placeholder="输入密码" required autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="loginPassword">显示</button>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">登录用户端</button>
      </form>

      <form id="registerForm" class="hidden" autocomplete="on">
        <div class="form-group">
          <label for="regUsername">用户名</label>
          <div class="input-wrapper"><input type="text" id="regUsername" placeholder="2-64 位用户名" required autocomplete="username"></div>
        </div>
        <div class="form-group">
          <label for="regEmail">邮箱</label>
          <div class="input-wrapper"><input type="email" id="regEmail" placeholder="例如 user@example.com" required autocomplete="email"></div>
        </div>
        <div class="form-group">
          <label for="regNickname">昵称</label>
          <div class="input-wrapper"><input type="text" id="regNickname" placeholder="可选，不填默认使用用户名" autocomplete="nickname"></div>
        </div>
        <div class="form-group">
          <label for="regPassword">密码</label>
          <div class="input-wrapper">
            <input type="password" id="regPassword" placeholder="至少 6 位" required autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="regPassword">显示</button>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="registerBtn">注册用户账号</button>
      </form>

    </div>
    <a href="/" class="back-link">返回首页</a>
  </div>

  <script>
    const API_BASE = '/api/v1';
    const loginParams = new URLSearchParams(location.search);
    let mode = loginParams.get('mode') || 'login';
    const nextUrl = loginParams.get('next');
    if (!['login', 'register'].includes(mode)) mode = 'login';

    const $ = (id) => document.getElementById(id);
    const msgBox = $('msgBox');
    const loginForm = $('loginForm');
    const registerForm = $('registerForm');

    function showMessage(msg, type = 'error') {
      msgBox.textContent = msg;
      msgBox.className = `message ${type} visible`;
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => msgBox.classList.remove('visible'), 5500);
    }

    function setMode(nextMode) {
      mode = nextMode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      loginForm.classList.toggle('hidden', mode !== 'login');
      registerForm.classList.toggle('hidden', mode !== 'register');
      $('pageSubtitle').textContent = '';
    }

    async function request(path, payload) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || data.message || '请求失败');
      return data;
    }

    function saveLogin(data) {
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      location.replace(nextUrl && nextUrl.startsWith('/') ? nextUrl : '/');
    }

    async function doLogin(account, password) {
      return request('/user/login', { account, username_or_email: account, password, role: 'user' });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = $(btn.dataset.target);
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        btn.textContent = visible ? '显示' : '隐藏';
      });
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const account = $('loginAccount').value.trim();
      const password = $('loginPassword').value;
      if (!account || !password) return showMessage('请填写账号和密码');
      if (password.length < 6) return showMessage('密码至少 6 位');
      $('loginBtn').disabled = true;
      $('loginBtn').textContent = '登录中...';
      try {
        saveLogin(await doLogin(account, password));
      } catch (err) {
        showMessage(err.message || '登录失败');
      } finally {
        $('loginBtn').disabled = false;
        $('loginBtn').textContent = '登录用户端';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = $('regUsername').value.trim();
      const email = $('regEmail').value.trim();
      const nickname = $('regNickname').value.trim();
      const password = $('regPassword').value;
      if (!username || username.length < 2) return showMessage('用户名至少 2 个字符');
      if (!email) return showMessage('请填写邮箱');
      if (!password || password.length < 6) return showMessage('密码至少 6 位');
      $('registerBtn').disabled = true;
      $('registerBtn').textContent = '注册中...';
      try {
        await request('/user/register', { username, email, nickname, password });
        showMessage('注册成功，正在自动登录...', 'success');
        saveLogin(await doLogin(username, password));
      } catch (err) {
        showMessage(err.message || '注册失败');
      } finally {
        $('registerBtn').disabled = false;
        $('registerBtn').textContent = '注册用户账号';
      }
    });

    setMode(mode);
  </script>
</body>
</html>
