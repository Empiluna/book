<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>在线阅读器 v2</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17202a;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f7fb;color:#17202a;overflow:hidden}
    .reader{height:100vh;display:grid;grid-template-rows:auto 1fr;background:#f6f7fb}
    .toolbar{height:74px;display:grid;grid-template-columns:minmax(180px,1fr) auto;align-items:center;gap:18px;padding:12px 22px;background:rgba(255,255,255,.92);border-bottom:1px solid #e5e7eb;box-shadow:0 10px 30px rgba(15,23,42,.06);z-index:5}
    .title{min-width:0}.title h1{margin:0 0 5px;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:10px;color:#64748b;font-size:12px}.progress{width:180px;height:7px;overflow:hidden;border-radius:999px;background:#e2e8f0}.progress div{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#06b6d4)}
    .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button{border:0;border-radius:12px;padding:9px 12px;background:#312e81;color:#fff;font-weight:800;cursor:pointer;line-height:1}button:hover{filter:brightness(1.06)}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#e2e8f0;color:#334155}.pagebox{display:flex;align-items:center;gap:6px;color:#475569;font-size:13px}.pagebox input{width:56px;height:34px;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-weight:800;background:white;color:#17202a}.zoom{min-width:54px;text-align:center;color:#475569;font-size:13px;font-weight:800}
    .stage{min-height:0;overflow:auto;padding:24px;background:radial-gradient(circle at 15% 5%,#dbeafe,transparent 34%),radial-gradient(circle at 86% 12%,#ede9fe,transparent 30%),#f8fafc}.stage:focus{outline:none}
    .pdf-pages{display:grid;gap:18px;justify-items:center}.pdf-page{max-width:100%;background:white;box-shadow:0 18px 46px rgba(15,23,42,.16);scroll-margin-top:24px}canvas{display:block;max-width:100%;height:auto;background:white}.pdf-placeholder{min-height:300px;display:grid;place-items:center;color:#94a3b8;font-size:14px;background:white;border-radius:4px}
    .epubbox{width:min(980px,100%);margin:0 auto;border:1px solid #e5e7eb;border-radius:18px;background:white;overflow:auto;box-shadow:0 18px 46px rgba(15,23,42,.14)}
    .text-pages{max-width:860px;margin:0 auto;display:grid;gap:16px;padding-bottom:60px}.text-page{padding:34px 42px;border-radius:18px;background:#fffaf0;border:1px solid rgba(120,113,108,.16);font-size:18px;line-height:1.9;box-shadow:0 16px 38px rgba(15,23,42,.08);scroll-margin-top:24px}.text-page b{display:block;margin-bottom:12px}.hint{max-width:760px;margin:60px auto;padding:22px;border-radius:18px;background:white;color:#64748b;line-height:1.7;box-shadow:0 16px 38px rgba(15,23,42,.08)}
    .night{background:#020617;color:#e2e8f0}.night .toolbar{background:rgba(15,23,42,.94);border-color:#1e293b}.night .stage{background:#020617}.night .pdf-page,.night .epubbox{filter:invert(.92) hue-rotate(180deg);box-shadow:none}.night .text-page{background:#111827;color:#f8fafc;border-color:#334155}.night .pagebox input{background:#0f172a;color:#e2e8f0;border-color:#334155}.night .ghost{background:#1e293b;color:#e2e8f0}
    @media(max-width:760px){body{overflow:auto}.reader{height:auto;min-height:100vh}.toolbar{height:auto;grid-template-columns:1fr;padding:12px}.tools{justify-content:flex-start}.stage{height:calc(100vh - 140px);padding:12px}.progress{width:120px}.text-page{padding:24px;font-size:16px}}
  </style>
</head>
<body>
  <div class="reader">
    <header class="toolbar">
      <div class="title">
        <h1 id="title">在线阅读</h1>
        <div class="meta"><span id="meta">加载中</span><div class="progress"><div id="prog"></div></div></div>
      </div>
      <div class="tools">
        <button id="prevBtn" onclick="prevPage()">上一页</button>
        <div class="pagebox"><input id="pageInput" value="1" inputmode="numeric" onkeydown="if(event.key==='Enter')goPage()"> / <span id="pageTotal">-</span></div>
        <button id="nextBtn" onclick="nextPage()">下一页</button>
        <button onclick="zoomOut()">缩小</button>
        <span id="zoomLabel" class="zoom">300%</span>
        <button onclick="zoomIn()">放大</button>
        <button class="ghost" onclick="fitWidth()">适宽</button>
        <button class="ghost" onclick="toggleNight()">夜间</button>
        <button class="ghost" onclick="saveProgress()">保存进度</button>
      </div>
    </header>
    <main id="stage" class="stage" tabindex="-1"><div class="hint">加载阅读器中...</div></main>
  </div>

  <script src="/static/vendor/jszip.min.js?v=3.10.1"></script>
  <script src="/static/vendor/epub.min.js?v=0.3.93"></script>
  <script>
    const API = '/api/v1';
    const params = new URLSearchParams(location.search);
    const bookId = params.get('book_id') || '1';
    const recordFlag = params.get('record');
    const token = localStorage.getItem('token') || '';

    let trial = null, mode = 'text', page = 1, pageTotal = 1;
    let pdfDoc = null, pdfUrl = null, scale = 3, fitMode = false, dpr = 1;
    let rendition = null, epubBook = null, epubFont = 100;
    let pageTimer = null, renderTimer = null, lastScrollTop = -1, rafId = null;

    const $ = id => document.getElementById(id);

    function headers(){
      return token ? {'Authorization':'Bearer '+token, 'Content-Type':'application/json'} : {'Content-Type':'application/json'};
    }
    async function api(path, opts={}){
      const r = await fetch(API+path, {headers:headers(), ...opts});
      if(!r.ok) throw new Error(await r.text());
      return r.json();
    }
    function absUrl(url){ return new URL(url, location.origin).href; }
    function allowed(){ return Math.max(1, trial?.allowed_pages || 99999); }
    function progress(){ return pageTotal>0 ? Math.min(100, Math.max(1, Math.round(page/pageTotal*100))) : 0; }

    function updateUi(){
      $('pageInput').value = page;
      $('pageTotal').textContent = pageTotal;
      $('prog').style.width = progress()+'%';
      $('meta').textContent = mode.toUpperCase()+' · 第 '+page+' 页 / 共 '+pageTotal+' 页 · st='+Math.round($('stage').scrollTop);
      $('zoomLabel').textContent = mode==='pdf' ? (fitMode?'适宽':Math.round(scale*100)+'%') : (mode==='epub'?epubFont+'%':'正文');
      $('prevBtn').disabled = page <= 1;
      $('nextBtn').disabled = page >= pageTotal;
    }

    // ── Helper: get element top relative to stage scroll container ──
    function topInStage(el){
      const stage = $('stage');
      return el.offsetTop - stage.offsetTop;
    }

    // ── Detect which page is currently visible ──
    function detectCurrentPage(){
      const stage = $('stage');
      const st = stage.scrollTop, sh = stage.clientHeight;
      const target = st + sh * 0.3;
      if(mode==='text'){
        const pages = stage.querySelectorAll('.text-page');
        if(!pages.length) return;
        let best = 1, bestDist = Infinity;
        pages.forEach((el,i) => {
          const dist = Math.abs(topInStage(el) - target);
          if(dist < bestDist){ bestDist = dist; best = i+1; }
        });
        if(best !== page){ page = best; updateUi(); }
      }else if(mode==='pdf'){
        const pages = stage.querySelectorAll('.pdf-page');
        if(!pages.length) return;
        let best = 1, bestDist = Infinity;
        pages.forEach((el,i) => {
          const dist = Math.abs(topInStage(el) - target);
          if(dist < bestDist){ bestDist = dist; best = i+1; }
        });
        if(best !== page){ page = best; updateUi(); }
      }
    }

    // ── Scroll handler (also called by rAF monitor) ──
    function onUserScroll(){
      if(!pageTimer){
        pageTimer = setTimeout(() => {
          pageTimer = null;
          detectCurrentPage();
        }, 100);
      }
      if(mode==='pdf' && !renderTimer){
        renderTimer = setTimeout(async () => {
          renderTimer = null;
          await renderNearbyPdfPages();
          detectCurrentPage();
        }, 400);
      }
    }

    // ── rAF-based scroll monitor: works even if scroll events don't fire ──
    function startRafMonitor(){
      if(rafId) return;
      function tick(){
        try {
          const stage = $('stage');
          const st = stage ? stage.scrollTop : 0;
          if(st !== lastScrollTop){
            lastScrollTop = st;
            onUserScroll();
          }
        } catch(e) {
          console.error('reader rAF error:', e);
        }
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);
    }
    function stopRafMonitor(){
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    }

    // ── Init ──
    async function init(){
      try{
        trial = await api('/ecosystem/trial/'+bookId+(recordFlag==='0'?'?record=0':''));
        $('title').textContent = trial.book.title + ' · 在线阅读';
        mode = trial.content_type;
        if(mode==='pdf' && trial.pdf_url) return await loadPdf(trial.pdf_url);
        if(mode==='epub' && trial.epub_url) return await loadEpub(trial.epub_url);
        renderText();
      }catch(e){
        $('stage').innerHTML = '<div class="hint">加载失败：'+e.message+'</div>';
      }
    }

    // ── Text ──
    function renderText(){
      mode='text'; page=1;
      const pages = trial.pages || [];
      pageTotal = pages.length || 1;
      $('stage').innerHTML = '<div class="text-pages">'+pages.map(p =>
        '<section class="text-page" data-page="'+p.page+'" id="tp'+p.page+'"><b>第 '+p.page+' 页</b><p>'+p.content+'</p></section>'
      ).join('')+'</div>';
      if(!$('stage')._hasScrollListener){
        $('stage')._hasScrollListener = true;
        $('stage').addEventListener('scroll', onUserScroll, {passive:true});
      }
      updateUi();
      $('stage').focus({preventScroll:true});
      detectCurrentPage();
      startRafMonitor();
    }

    // ── PDF: render pages lazily ──
    async function loadPdf(url){
      pdfUrl = absUrl(url); mode='pdf'; page=1;
      $('stage').innerHTML = '<div id="pdfPages" class="pdf-pages"><div class="hint">PDF 加载中...</div></div>';
      try {
        const pdfjsLib = await import('/static/vendor/pdf.min.mjs?v=4.10.38');
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdf.worker.min.mjs?v=4.10.38';
        pdfDoc = await pdfjsLib.getDocument({url:pdfUrl}).promise;
        pageTotal = Math.min(pdfDoc.numPages, allowed());
        dpr = Math.min(window.devicePixelRatio||1, 2);

        if(fitMode){
          const fp = await pdfDoc.getPage(1);
          const host = $('stage');
          const avail = Math.max(320, host.clientWidth-48);
          scale = Math.min(3.2, Math.max(.8, avail/fp.getViewport({scale:1}).width));
        }

        // Create placeholders for all pages
        let html = '';
        for(let i=1; i<=pageTotal; i++){
          html += '<div class="pdf-page pdf-placeholder" data-page="'+i+'">第 '+i+' 页</div>';
        }
        $('stage').innerHTML = '<div id="pdfPages" class="pdf-pages">'+html+'</div>';
        updateUi();

        // Register scroll listener for lazy PDF page rendering
        if(!$('stage')._hasScrollListener){
          $('stage')._hasScrollListener = true;
          $('stage').addEventListener('scroll', onUserScroll, {passive:true});
        }

        // Render first pages immediately
        await renderNearbyPdfPages();
        $('stage').focus({preventScroll:true});
        detectCurrentPage();
        startRafMonitor();
      } catch(e) {
        $('stage').innerHTML = '<div class="hint">PDF 加载失败：'+e.message+'<br><small>'+pdfUrl+'</small></div>';
      }
    }

    async function renderOnePdfPage(el){
      const pn = parseInt(el.dataset.page);
      try {
        const pdfPage = await pdfDoc.getPage(pn);
        const host = $('stage');
        const avail = Math.max(320, host.clientWidth-48);
        const viewport = pdfPage.getViewport({scale});
        const dw = fitMode ? Math.min(1120, avail) : viewport.width;
        const dh = viewport.height * (dw/viewport.width);

        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width*dpr);
        canvas.height = Math.floor(viewport.height*dpr);
        canvas.style.width = Math.floor(dw)+'px';
        canvas.style.height = Math.floor(dh)+'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr,0,0,dpr,0,0);
        await pdfPage.render({canvasContext:ctx, viewport}).promise;

        el.classList.remove('pdf-placeholder');
        el.innerHTML = '';
        el.appendChild(canvas);
        return true;
      } catch(e) { el.textContent = '渲染失败'; return false; }
    }

    async function renderNearbyPdfPages(){
      if(!pdfDoc) return;
      const stage = $('stage');
      const BATCH = 4;
      let safety = 0;
      while(safety < 50){  // keep rendering while there are nearby placeholders
        safety++;
        const st = stage.scrollTop, sh = stage.clientHeight;
        const margin = sh * 2.5;
        const placeholders = stage.querySelectorAll('.pdf-placeholder');
        if(!placeholders.length) break;
        const batch = [];
        for(const el of placeholders){
          const ot = topInStage(el);
          if(ot > st - margin && ot < st + sh + margin){
            batch.push(el);
            if(batch.length >= BATCH) break;
          }
        }
        if(!batch.length) break;
        await Promise.all(batch.map(renderOnePdfPage));
      }
      const rendered = stage.querySelectorAll('.pdf-page:not(.pdf-placeholder)').length;
      $('meta').textContent = 'PDF · '+pageTotal+' 页 · 已渲染 '+rendered+'/'+pageTotal;
    }

    // Quick rescale for zoom (clear canvases, re-render visible)
    async function quickReloadPdf(){
      if(!pdfDoc) return;
      const stage = $('stage');
      const all = stage.querySelectorAll('.pdf-page');
      all.forEach(el => { el.innerHTML = ''; el.classList.add('pdf-placeholder'); el.textContent = '第 '+el.dataset.page+' 页'; });
      updateUi();
      await renderNearbyPdfPages();
    }

    // ── EPUB ──
    async function loadEpub(url){
      mode='epub'; page=1; pageTotal=allowed();
      $('stage').innerHTML = '<div id="epub" class="epubbox" style="height:calc(100vh - 122px)"><div class="hint">EPUB 加载中...</div></div>';
      const res = await fetch(absUrl(url));
      if(!res.ok) throw new Error('EPUB读取失败：'+res.status);
      epubBook = ePub(await res.arrayBuffer(), {openAs:'binary'});
      rendition = epubBook.renderTo('epub', {width:'100%', height:'100%', flow:'scrolled-doc', manager:'default'});
      rendition.themes.default({body:{'font-size':epubFont+'%', 'line-height':'1.75'}, p:{'line-height':'1.75'}});
      await rendition.display();
      document.querySelector('#epub > .hint')?.remove();

      rendition.on('relocated', loc => {
        const total = epubBook.locations.total || pageTotal;
        pageTotal = Math.min(total, allowed());
        page = Math.min(pageTotal, (loc.start.index||0)+1);
        updateUi();
      });

      // EPUB scroll tracking
      const epubEl = document.getElementById('epub');
      if(epubEl){
        epubEl.addEventListener('scroll', () => {
          if(pageTimer) clearTimeout(pageTimer);
          pageTimer = setTimeout(() => {
            const ratio = (epubEl.scrollTop+epubEl.clientHeight)/epubEl.scrollHeight;
            const est = Math.max(1, Math.min(pageTotal, Math.ceil(ratio*pageTotal)));
            if(est !== page){ page = est; updateUi(); }
          }, 300);
        }, {passive:true});
      }
      updateUi();
    }

    // ── Navigation (manual scrollTop to avoid parent scroll propagation) ──
    function scrollToPage(p){
      const stage = $('stage');
      if(mode==='pdf'){
        const el = document.querySelector('.pdf-page[data-page="'+p+'"]');
        if(el) stage.scrollTop = topInStage(el) - 24;
      }else if(mode==='text'){
        const el = $('tp'+p);
        if(el) stage.scrollTop = topInStage(el) - 24;
      }
      // Ensure scroll listener is registered for manual scroll tracking
      if(!stage._hasScrollListener){
        stage._hasScrollListener = true;
        stage.addEventListener('scroll', onUserScroll, {passive:true});
      }
    }

    function goPage(){
      const next = Math.min(pageTotal, Math.max(1, Number($('pageInput').value)||1));
      page = next;
      if(mode==='epub' && rendition){ rendition.display(next-1); }
      else { scrollToPage(next); }
      updateUi();
    }

    function nextPage(){
      if(page >= pageTotal) return;
      page++;
      if(mode==='epub' && rendition){ rendition.next(); }
      else { scrollToPage(page); }
      updateUi();
    }

    function prevPage(){
      if(page <= 1) return;
      page--;
      if(mode==='epub' && rendition){ rendition.prev(); }
      else { scrollToPage(page); }
      updateUi();
    }

    // ── Zoom ──
    async function zoomIn(){
      if(mode==='pdf'){
        fitMode = false; scale = Math.min(scale+0.25, 4);
        if(pdfDoc){ page=1; await quickReloadPdf(); $('stage').scrollTop=0; }
      }else if(mode==='epub' && rendition){
        epubFont = Math.min(epubFont+10, 160);
        rendition.themes.fontSize(epubFont+'%');
      }
      updateUi();
    }
    async function zoomOut(){
      if(mode==='pdf'){
        fitMode = false; scale = Math.max(scale-0.25, 0.5);
        if(pdfDoc){ page=1; await quickReloadPdf(); $('stage').scrollTop=0; }
      }else if(mode==='epub' && rendition){
        epubFont = Math.max(epubFont-10, 70);
        rendition.themes.fontSize(epubFont+'%');
      }
      updateUi();
    }
    async function fitWidth(){
      if(mode==='pdf'){
        fitMode = true;
        const host = $('stage');
        const avail = Math.max(320, host.clientWidth-48);
        const fp = await pdfDoc.getPage(1);
        scale = Math.min(3.2, Math.max(.8, avail/fp.getViewport({scale:1}).width));
        if(pdfDoc){ page=1; await quickReloadPdf(); $('stage').scrollTop=0; }
        updateUi();
      }
    }

    function toggleNight(){ document.body.classList.toggle('night'); }

    async function saveProgress(){
      try {
        await api('/user/progress/'+bookId, {method:'POST', body:JSON.stringify({current_page:page, progress_percent:progress(), reading_minutes:12, last_device:'Web Reader'})});
        alert('阅读进度已保存：'+progress()+'%');
      } catch(e) { alert('请先登录后保存进度'); }
    }

    // Resize handler for PDF
    window.addEventListener('resize', () => {
      if(mode==='pdf' && fitMode && pdfDoc){
        const host = $('stage');
        const avail = Math.max(320, host.clientWidth-48);
        pdfDoc.getPage(1).then(fp => {
          scale = Math.min(3.2, Math.max(.8, avail/fp.getViewport({scale:1}).width));
          quickReloadPdf();
        });
      }
    });

    init();
  </script>
</body>
</html>
