<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>在线阅读器</title>
  <style>
    :root{
      --bg:#f3eee4;
      --paper:#fffaf1;
      --paper-2:#fffdf8;
      --ink:#1d2430;
      --muted:#697586;
      --line:rgba(68,54,35,.14);
      --brand:#2563eb;
      --brand-2:#d97706;
      --shadow:0 22px 70px rgba(43,35,23,.15);
      --reader-font-scale:1;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--ink);
      background:var(--bg);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      overflow:hidden;
      background:
        linear-gradient(180deg,rgba(255,255,255,.56),rgba(255,255,255,0) 36%),
        radial-gradient(circle at 16% 8%,rgba(217,119,6,.14),transparent 28%),
        radial-gradient(circle at 84% 10%,rgba(37,99,235,.12),transparent 30%),
        var(--bg);
      color:var(--ink);
    }
    .reader{
      height:100vh;
      display:grid;
      grid-template-rows:auto 1fr;
    }
    .toolbar{
      position:relative;
      z-index:5;
      display:grid;
      grid-template-columns:minmax(220px,1fr) auto;
      align-items:center;
      gap:18px;
      min-height:78px;
      padding:12px 22px;
      border-bottom:1px solid rgba(68,54,35,.1);
      background:rgba(255,253,248,.88);
      backdrop-filter:blur(18px);
      box-shadow:0 14px 36px rgba(43,35,23,.08);
    }
    .title{min-width:0}
    .title h1{
      margin:0 0 7px;
      font-size:18px;
      line-height:1.25;
      letter-spacing:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      min-width:0;
    }
    .meta span{
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .progress{
      width:190px;
      height:8px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(68,54,35,.12);
      flex:0 0 auto;
    }
    .progress div{
      height:100%;
      width:0;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--brand-2),var(--brand));
      transition:width .2s ease;
    }
    .tools{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }
    button{
      height:36px;
      border:1px solid rgba(68,54,35,.12);
      border-radius:12px;
      padding:0 13px;
      background:#1f2937;
      color:#fff;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      line-height:1;
      transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    button:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 22px rgba(31,41,55,.16);
    }
    button:disabled{
      opacity:.42;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }
    .ghost{
      background:rgba(255,255,255,.74);
      color:#344054;
    }
    .pagebox{
      height:36px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:0 10px;
      border:1px solid rgba(68,54,35,.12);
      border-radius:12px;
      background:rgba(255,255,255,.72);
      color:#667085;
      font-size:13px;
      font-weight:800;
    }
    .pagebox input{
      width:48px;
      height:26px;
      border:0;
      border-radius:8px;
      text-align:center;
      font-weight:900;
      background:#fffaf1;
      color:var(--ink);
      outline:none;
    }
    .zoom{
      min-width:58px;
      text-align:center;
      color:#475467;
      font-size:13px;
      font-weight:900;
    }
    .stage{
      position:relative;
      min-height:0;
      overflow:auto;
      padding:28px;
      scroll-behavior:smooth;
    }
    body.epub-mode{overflow:hidden}
    body.epub-mode .stage{
      overflow:hidden;
      display:grid;
      place-items:center;
      padding:28px;
    }
    .stage:focus{outline:none}
    .pdf-pages{
      display:grid;
      gap:22px;
      justify-items:center;
      width:max-content;
      min-width:100%;
      margin:0 auto;
      padding-bottom:48px;
    }
    .pdf-page{
      max-width:none;
      overflow:visible;
      border-radius:8px;
      background:#fff;
      box-shadow:var(--shadow);
      scroll-margin-top:24px;
    }
    canvas{
      display:block;
      max-width:none;
      height:auto;
      background:#fff;
    }
    .pdf-placeholder{
      min-height:320px;
      width:min(760px,100%);
      display:grid;
      place-items:center;
      color:#98a2b3;
      font-size:14px;
      border:1px dashed rgba(68,54,35,.18);
      background:rgba(255,255,255,.72);
    }
    .epubbox{
      width:min(980px,100%);
      margin:0 auto 54px;
      overflow:hidden;
      border:1px solid rgba(68,54,35,.12);
      border-radius:18px;
      background:var(--paper-2);
      box-shadow:var(--shadow);
    }
    body.epub-mode .epubbox{
      height:calc(100vh - 134px);
      margin:0 auto;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:thin;
      scrollbar-color:rgba(31,41,55,.38) transparent;
    }
    .epub-chapter{
      max-width:760px;
      margin:0 auto;
      padding:42px 48px;
      color:var(--ink);
      font-size:calc(18px * var(--reader-font-scale));
      line-height:1.9;
      word-break:break-word;
    }
    .epub-chapter + .epub-chapter{
      border-top:1px solid rgba(68,54,35,.1);
    }
    .epub-chapter p{
      margin:0 0 1em;
    }
    .epub-chapter img,
    .epub-chapter svg{
      max-width:100%;
      height:auto;
    }
    .text-pages{
      width:min(840px,100%);
      margin:0 auto;
      display:grid;
      gap:18px;
      padding-bottom:60px;
    }
    .text-page{
      padding:38px 44px;
      border:1px solid rgba(68,54,35,.12);
      border-radius:18px;
      background:var(--paper);
      color:#2b2118;
      font-size:calc(18px * var(--reader-font-scale));
      line-height:1.95;
      box-shadow:0 18px 50px rgba(43,35,23,.09);
      scroll-margin-top:24px;
    }
    .text-page b{
      display:block;
      margin-bottom:14px;
      color:#92400e;
      font-size:13px;
      letter-spacing:.08em;
    }
    .text-page p{margin:0}
    .hint{
      width:min(760px,calc(100% - 24px));
      margin:68px auto;
      padding:24px;
      border:1px solid rgba(68,54,35,.12);
      border-radius:18px;
      background:rgba(255,253,248,.86);
      color:#667085;
      line-height:1.75;
      box-shadow:0 18px 48px rgba(43,35,23,.08);
    }
    .night{
      --bg:#0b1020;
      --paper:#111827;
      --paper-2:#0f172a;
      --ink:#e5e7eb;
      --muted:#9ca3af;
      --line:rgba(226,232,240,.13);
      background:#0b1020;
      color:#e5e7eb;
    }
    .night .toolbar{
      background:rgba(15,23,42,.9);
      border-color:rgba(226,232,240,.1);
      box-shadow:0 14px 36px rgba(0,0,0,.22);
    }
    .night .stage{
      background:radial-gradient(circle at 28% 0,rgba(37,99,235,.14),transparent 28%),#0b1020;
    }
    .night .pdf-page{
      background:#0f172a;
      box-shadow:0 18px 50px rgba(0,0,0,.24);
    }
    .night .pdf-page canvas{
      filter:invert(.9) hue-rotate(180deg) brightness(.96) contrast(.96);
    }
    .night .epubbox{
      background:#111827;
      border-color:#243145;
      box-shadow:0 18px 50px rgba(0,0,0,.24);
    }
    .night .epub-chapter,
    .night .epub-chapter :where(p,span,div,section,article,h1,h2,h3,h4,h5,h6,li,blockquote,strong,em){
      color:#dbe4f0 !important;
      background:transparent !important;
    }
    .night .epub-chapter a{color:#93c5fd !important}
    .night .epub-chapter img,
    .night .epub-chapter svg{filter:none}
    .night .text-page{
      background:#111827;
      color:#e5e7eb;
      border-color:#243145;
      box-shadow:0 18px 50px rgba(0,0,0,.24);
    }
    .night .text-page b{color:#fbbf24}
    .night .pagebox,
    .night .ghost{
      background:#182235;
      color:#e5e7eb;
      border-color:#263449;
    }
    .night .pagebox input{
      background:#0f172a;
      color:#e5e7eb;
    }
    .night .hint{
      background:#111827;
      color:#cbd5e1;
      border-color:#263449;
    }
    @media(max-width:860px){
      body{overflow:auto}
      .reader{height:auto;min-height:100vh}
      .toolbar{
        min-height:0;
        grid-template-columns:1fr;
        gap:12px;
        padding:12px;
      }
      .tools{justify-content:flex-start}
      .stage{height:calc(100vh - 156px);padding:14px}
      .progress{width:120px}
      .title h1{font-size:16px}
      .text-page{padding:26px 22px;font-size:16px;line-height:1.86}
      button{height:34px;padding:0 11px}
      .pagebox{height:34px}
    }
  </style>
</head>
<body>
  <div class="reader">
    <header class="toolbar">
      <div class="title">
        <h1 id="title">在线阅读</h1>
        <div class="meta"><span id="meta">正在加载...</span><div class="progress"><div id="prog"></div></div></div>
      </div>
      <div class="tools">
        <button id="prevBtn" onclick="prevPage()">上一页</button>
        <div class="pagebox"><input id="pageInput" value="1" inputmode="numeric" onkeydown="if(event.key==='Enter')goPage()"> / <span id="pageTotal">-</span></div>
        <button id="nextBtn" onclick="nextPage()">下一页</button>
        <button onclick="zoomOut()">缩小</button>
        <span id="zoomLabel" class="zoom">300%</span>
        <button onclick="zoomIn()">放大</button>
        <button class="ghost" onclick="fitWidth()">适宽</button>
        <button class="ghost" onclick="toggleNight()">夜间</button>
        <button class="ghost" onclick="saveProgress(true, true)">保存进度</button>
      </div>
    </header>
    <main id="stage" class="stage" tabindex="-1"><div class="hint">正在加载阅读器...</div></main>
  </div>

  <script src="/static/vendor/jszip.min.js?v=3.10.1"></script>
  <script src="/static/vendor/epub.min.js?v=0.3.93"></script>
  <script>
    const API = '/api/v1';
    const params = new URLSearchParams(location.search);
    const bookId = params.get('book_id') || '1';
    const recordFlag = params.get('record');
    const startPage = Math.max(1, Number(params.get('page')) || 1);
    const token = localStorage.getItem('token') || '';

    let trial = null, mode = 'text', page = 1, pageTotal = 1, pageTotalKnown = true;
    let pdfDoc = null, pdfUrl = null, scale = 3, fitMode = false, dpr = 1;
    let rendition = null, epubBook = null, epubFont = 100, textFont = 100, epubPercent = 0, epubWheelLock = false, touchStartY = null, epubScrollEl = null;
    let pageTimer = null, renderTimer = null, lastScrollTop = -1, rafId = null;
    let autoSaveTimer = null;
    let lastSavedPage = 0;
    let lastSavedProgress = 0;
    let lastSavedAt = 0;
    let readerEnterAt = Date.now();
    let readerReady = false;
    let suppressAutoSave = true;

    const $ = id => document.getElementById(id);
    function escapeHtml(value){
      return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function headers(){
      return token ? {'Authorization':'Bearer '+token, 'Content-Type':'application/json'} : {'Content-Type':'application/json'};
    }
    async function api(path, opts={}){
      const r = await fetch(API+path, {headers:headers(), ...opts});
      if(!r.ok) throw new Error(await r.text());
      return r.json();
    }
    function absUrl(url){ return new URL(url, location.origin).href; }
    function allowed(){ return Math.max(1, trial?.allowed_pages || 99999); }
    function isUnlimited(){ return allowed() >= 90000; }
    function applyReaderFontScale(percent){
      document.documentElement.style.setProperty('--reader-font-scale', (percent / 100).toFixed(2));
    }
    function progress(){
      if(mode === 'epub' && !pageTotalKnown) return Math.min(100, Math.max(1, Math.round(epubPercent * 100)));
      return pageTotal>0 ? Math.min(100, Math.max(1, Math.round(page/pageTotal*100))) : 0;
    }
    function modeLabel(){
      if(mode === 'pdf') return 'PDF';
      if(mode === 'epub') return 'EPUB';
      return '文本';
    }

    function updateUi(){
      $('pageInput').value = page;
      const totalLabel = pageTotalKnown ? pageTotal : (mode === 'epub' && isUnlimited() ? '全文' : '-');
      $('pageTotal').textContent = totalLabel;
      $('prog').style.width = progress()+'%';
      $('meta').textContent = pageTotalKnown
        ? modeLabel()+' · 第 '+page+' 页 / 共 '+pageTotal+' 页 · '+progress()+'%'
        : modeLabel()+' · 第 '+page+' 屏 · '+progress()+'%';
      $('zoomLabel').textContent = mode==='pdf' ? (fitMode?'适宽':Math.round(scale*100)+'%') : ((mode==='epub'?epubFont:textFont)+'%');
      $('prevBtn').disabled = page <= 1;
      $('nextBtn').disabled = pageTotalKnown && page >= pageTotal;
    }

    function topInStage(el){
      const stage = $('stage');
      return el.offsetTop - stage.offsetTop;
    }

    function detectCurrentPage(){
      const stage = $('stage');
      const st = stage.scrollTop, sh = stage.clientHeight;
      const target = st + sh * 0.3;
      if(mode==='text'){
        const pages = stage.querySelectorAll('.text-page');
        if(!pages.length) return;
        let best = 1, bestDist = Infinity;
        pages.forEach((el,i) => {
          const dist = Math.abs(topInStage(el) - target);
          if(dist < bestDist){ bestDist = dist; best = i+1; }
        });
        if(best !== page){ page = best; updateUi(); scheduleAutoSave(); }
      }else if(mode==='pdf'){
        const pages = stage.querySelectorAll('.pdf-page');
        if(!pages.length) return;
        let best = 1, bestDist = Infinity;
        pages.forEach((el,i) => {
          const dist = Math.abs(topInStage(el) - target);
          if(dist < bestDist){ bestDist = dist; best = i+1; }
        });
        if(best !== page){ page = best; updateUi(); scheduleAutoSave(); }
      }
    }

    function onUserScroll(){
      if(!pageTimer){
        pageTimer = setTimeout(() => {
          pageTimer = null;
          detectCurrentPage();
        }, 100);
      }
      if(mode==='pdf' && !renderTimer){
        renderTimer = setTimeout(async () => {
          renderTimer = null;
          await renderNearbyPdfPages();
          detectCurrentPage();
        }, 400);
      }
    }

    function startRafMonitor(){
      if(rafId) return;
      function tick(){
        const stage = $('stage');
        const st = stage ? stage.scrollTop : 0;
        if(st !== lastScrollTop){
          lastScrollTop = st;
          onUserScroll();
        }
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);
    }
    function stopRafMonitor(){
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    }

    async function init(){
      try{
        trial = await api('/ecosystem/trial/'+bookId+(recordFlag==='0'?'?record=0':''));
        $('title').textContent = (trial.book?.title || '在线阅读') + ' · 在线阅读';
        mode = trial.content_type;
        if(mode==='pdf' && trial.pdf_url) return await loadPdf(trial.pdf_url);
        if(mode==='epub' && trial.epub_url) return await loadEpub(trial.epub_url);
        renderText();
      }catch(e){
        $('stage').innerHTML = '<div class="hint">加载失败：'+e.message+'</div>';
      }
    }

    function renderText(){
      document.body.classList.remove('epub-mode');
      mode='text'; page=1; pageTotalKnown = true;
      applyReaderFontScale(textFont);
      const pages = trial.pages || [];
      pageTotal = pages.length || 1;
      $('stage').innerHTML = '<div class="text-pages">'+pages.map(p =>
        '<section class="text-page" data-page="'+p.page+'" id="tp'+p.page+'"><b>第 '+p.page+' 页</b><p>'+p.content+'</p></section>'
      ).join('')+'</div>';
      if(!$('stage')._hasScrollListener){
        $('stage')._hasScrollListener = true;
        $('stage').addEventListener('scroll', onUserScroll, {passive:true});
      }
      updateUi();
      $('stage').focus({preventScroll:true});
      detectCurrentPage();
      startRafMonitor();
      jumpToInitialPage();
    }

    async function loadPdf(url){
      document.body.classList.remove('epub-mode');
      pdfUrl = absUrl(url); mode='pdf'; page=1;
      $('stage').innerHTML = '<div id="pdfPages" class="pdf-pages"><div class="hint">PDF 正在加载...</div></div>';
      try {
        const pdfjsLib = await import('/static/vendor/pdf.min.mjs?v=4.10.38');
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdf.worker.min.mjs?v=4.10.38';
        pdfDoc = await pdfjsLib.getDocument({url:pdfUrl}).promise;
        pageTotal = Math.min(pdfDoc.numPages, allowed());
        pageTotalKnown = true;
        dpr = Math.min(window.devicePixelRatio||1, 2);

        if(fitMode){
          const fp = await pdfDoc.getPage(1);
          const host = $('stage');
          const avail = Math.max(320, host.clientWidth-56);
          scale = Math.min(3.2, Math.max(.8, avail/fp.getViewport({scale:1}).width));
        }

        let html = '';
        for(let i=1; i<=pageTotal; i++){
          html += '<div class="pdf-page pdf-placeholder" data-page="'+i+'">第 '+i+' 页</div>';
        }
        $('stage').innerHTML = '<div id="pdfPages" class="pdf-pages">'+html+'</div>';
        updateUi();

        if(!$('stage')._hasScrollListener){
          $('stage')._hasScrollListener = true;
          $('stage').addEventListener('scroll', onUserScroll, {passive:true});
        }

        await renderNearbyPdfPages();
        $('stage').focus({preventScroll:true});
        detectCurrentPage();
        startRafMonitor();
        await jumpToInitialPage();
      } catch(e) {
        $('stage').innerHTML = '<div class="hint">PDF 加载失败：'+e.message+'<br><small>'+pdfUrl+'</small></div>';
      }
    }

    async function renderOnePdfPage(el){
      const pn = parseInt(el.dataset.page);
      try {
        const pdfPage = await pdfDoc.getPage(pn);
        const viewport = pdfPage.getViewport({scale});

        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width*dpr);
        canvas.height = Math.floor(viewport.height*dpr);
        canvas.style.width = Math.floor(viewport.width)+'px';
        canvas.style.height = Math.floor(viewport.height)+'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr,0,0,dpr,0,0);
        await pdfPage.render({canvasContext:ctx, viewport}).promise;

        el.classList.remove('pdf-placeholder');
        el.innerHTML = '';
        el.appendChild(canvas);
        return true;
      } catch(e) {
        el.textContent = '渲染失败';
        return false;
      }
    }

    async function renderNearbyPdfPages(){
      if(!pdfDoc) return;
      const stage = $('stage');
      const BATCH = 4;
      let safety = 0;
      while(safety < 50){
        safety++;
        const st = stage.scrollTop, sh = stage.clientHeight;
        const margin = sh * 2.5;
        const placeholders = stage.querySelectorAll('.pdf-placeholder');
        if(!placeholders.length) break;
        const batch = [];
        for(const el of placeholders){
          const ot = topInStage(el);
          if(ot > st - margin && ot < st + sh + margin){
            batch.push(el);
            if(batch.length >= BATCH) break;
          }
        }
        if(!batch.length) break;
        await Promise.all(batch.map(renderOnePdfPage));
      }
    }

    async function quickReloadPdf(targetPage=page){
      if(!pdfDoc) return;
      const stage = $('stage');
      const all = stage.querySelectorAll('.pdf-page');
      all.forEach(el => {
        el.innerHTML = '';
        el.classList.add('pdf-placeholder');
        el.textContent = '第 '+el.dataset.page+' 页';
      });
      page = Math.min(pageTotal || targetPage, Math.max(1, targetPage));
      updateUi();
      scrollToPage(page);
      await renderNearbyPdfPages();
      scrollToPage(page);
      detectCurrentPage();
    }

    async function loadEpub(url){
      document.body.classList.add('epub-mode');
      mode='epub'; page=1; pageTotal=0; pageTotalKnown = false; epubPercent = 0; epubScrollEl = null; rendition = null; epubBook = null;
      applyReaderFontScale(epubFont);
      $('stage').innerHTML = '<div id="epub" class="epubbox"><div class="hint">EPUB 正在加载...</div></div>';
      try{
        if(typeof JSZip === 'undefined') throw new Error('EPUB 解析组件未加载，请刷新页面重试');
        const res = await fetch(absUrl(url));
        if(!res.ok) throw new Error('EPUB 读取失败：'+res.status);
        await renderEpubHtml(await res.arrayBuffer());
        updateUi();
        await jumpToInitialPage();
      }catch(e){
        $('stage').innerHTML = '<div class="hint">EPUB 加载失败：'+escapeHtml(e.message || '未知错误')+'<br><small>'+escapeHtml(url)+'</small></div>';
      }
    }

    function dirname(path){
      const idx = path.lastIndexOf('/');
      return idx >= 0 ? path.slice(0, idx + 1) : '';
    }

    function normalizePath(path){
      const out = [];
      path.split('/').forEach(part => {
        if(!part || part === '.') return;
        if(part === '..') out.pop();
        else out.push(part);
      });
      return out.join('/');
    }

    function mediaMime(path){
      const ext = path.split('.').pop().toLowerCase();
      if(ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
      if(ext === 'png') return 'image/png';
      if(ext === 'gif') return 'image/gif';
      if(ext === 'webp') return 'image/webp';
      if(ext === 'svg') return 'image/svg+xml';
      return 'application/octet-stream';
    }

    async function epubDataUrl(zip, path){
      const file = zip.file(path);
      if(!file) return null;
      const base64 = await file.async('base64');
      return `data:${mediaMime(path)};base64,${base64}`;
    }

    async function resolveEpubAsset(zip, base, raw){
      if(!raw || raw.startsWith('data:') || raw.startsWith('http:') || raw.startsWith('https:') || raw.startsWith('#')) return raw;
      const [pathPart, anchor = ''] = raw.split('#');
      const assetPath = normalizePath(base + pathPart);
      const dataUrl = await epubDataUrl(zip, assetPath);
      return dataUrl ? dataUrl + (anchor ? `#${anchor}` : '') : raw;
    }

    async function inlineEpubCssAssets(zip, base, css){
      const matches = [...css.matchAll(/url\((['"]?)([^'")]+)\1\)/g)];
      let output = css;
      for(const match of matches){
        const dataUrl = await resolveEpubAsset(zip, base, match[2]);
        if(dataUrl && dataUrl !== match[2]) output = output.replace(match[0], `url("${dataUrl}")`);
      }
      return output;
    }

    async function renderEpubHtml(buffer){
      const zip = await JSZip.loadAsync(buffer);
      const parser = new DOMParser();
      const epubEl = document.getElementById('epub');
      epubEl.innerHTML = '<div class="hint">EPUB 正在解析目录...</div>';
      const containerText = await zip.file('META-INF/container.xml').async('text');
      const containerDoc = parser.parseFromString(containerText, 'application/xml');
      const rootPath = containerDoc.querySelector('rootfile')?.getAttribute('full-path');
      if(!rootPath) throw new Error('EPUB 缺少 OPF 入口');

      const opfText = await zip.file(rootPath).async('text');
      const opfDoc = parser.parseFromString(opfText, 'application/xml');
      const base = dirname(rootPath);
      const manifest = {};
      opfDoc.querySelectorAll('manifest item').forEach(item => {
        manifest[item.getAttribute('id')] = item.getAttribute('href');
      });
      const spine = [...opfDoc.querySelectorAll('spine itemref')]
        .map(item => manifest[item.getAttribute('idref')])
        .filter(Boolean)
        .map(href => normalizePath(base + href));

      const chapters = [];
      epubEl.innerHTML = '<div class="hint">EPUB 正在加载章节 0 / '+spine.length+'</div>';
      for(const chapterPath of spine){
        const file = zip.file(chapterPath);
        if(!file) continue;
        const text = await file.async('text');
        const doc = parser.parseFromString(text, 'text/html');
        doc.querySelectorAll('script, iframe, object').forEach(el => el.remove());
        const chapterBase = dirname(chapterPath);

        for(const link of [...doc.querySelectorAll('link[rel~="stylesheet"][href]')]){
          const href = link.getAttribute('href');
          const cssPath = normalizePath(chapterBase + href.split('#')[0]);
          const cssFile = zip.file(cssPath);
          if(!cssFile) {
            link.remove();
            continue;
          }
          const style = doc.createElement('style');
          style.textContent = await inlineEpubCssAssets(zip, dirname(cssPath), await cssFile.async('text'));
          link.replaceWith(style);
        }

        for(const el of [...doc.querySelectorAll('img[src], source[srcset]')]){
          if(el.hasAttribute('src')){
            const resolved = await resolveEpubAsset(zip, chapterBase, el.getAttribute('src'));
            if(resolved) el.setAttribute('src', resolved);
          }
          if(el.hasAttribute('srcset')){
            const parts = [];
            for(const item of el.getAttribute('srcset').split(',')){
              const bits = item.trim().split(/\s+/);
              if(!bits[0]) continue;
              bits[0] = await resolveEpubAsset(zip, chapterBase, bits[0]);
              parts.push(bits.join(' '));
            }
            el.setAttribute('srcset', parts.join(', '));
          }
        }

        for(const el of [...doc.querySelectorAll('image')]){
          const raw = el.getAttribute('href') || el.getAttribute('xlink:href');
          const resolved = await resolveEpubAsset(zip, chapterBase, raw);
          if(resolved){
            el.setAttribute('href', resolved);
            el.setAttribute('xlink:href', resolved);
          }
        }

        for(const el of [...doc.querySelectorAll('[style]')]){
          el.setAttribute('style', await inlineEpubCssAssets(zip, chapterBase, el.getAttribute('style')));
        }
        const body = doc.body || doc.documentElement;
        const html = body?.innerHTML?.trim();
        if(html){
          const article = `<article class="epub-chapter">${html}</article>`;
          chapters.push(article);
          if(chapters.length === 1) epubEl.innerHTML = '';
          epubEl.insertAdjacentHTML('beforeend', article);
          if(chapters.length === 1 || chapters.length % 3 === 0){
            updateUi();
            await wait(0);
          }
        }
      }

      if(!chapters.length) epubEl.innerHTML = '<div class="hint">EPUB 暂无可显示内容</div>';
      epubScrollEl = epubEl;
      pageTotalKnown = false;
      setTimeout(() => {
        const max = Math.max(1, epubEl.scrollHeight - epubEl.clientHeight);
        pageTotal = Math.max(1, Math.ceil(max / Math.max(360, epubEl.clientHeight * .86)));
        pageTotalKnown = true;
        syncEpubScrollProgress();
      }, 80);
      bindEpubPagingGestures();
      bindEpubBoxScroll();
    }

    function bindEpubBoxScroll(){
      const epubEl = document.getElementById('epub');
      if(!epubEl || epubEl._hasReaderScroll) return;
      epubEl._hasReaderScroll = true;
      if(!epubScrollEl) epubScrollEl = epubEl;
      epubEl.addEventListener('scroll', () => {
        epubScrollEl = epubEl;
        if(pageTimer) clearTimeout(pageTimer);
        pageTimer = setTimeout(syncEpubScrollProgress, 80);
      }, {passive:true});
    }

    function epubCanScroll(direction){
      if(!epubScrollEl) return false;
      const max = epubScrollEl.scrollHeight - epubScrollEl.clientHeight;
      if(max <= 6) return false;
      return direction > 0 ? epubScrollEl.scrollTop < max - 6 : epubScrollEl.scrollTop > 6;
    }

    async function turnEpub(direction){
      if(!epubScrollEl) epubScrollEl = document.getElementById('epub');
      if(!epubScrollEl && !rendition) return;
      if(epubCanScroll(direction)){
        const delta = direction > 0 ? epubScrollEl.clientHeight * .86 : -epubScrollEl.clientHeight * .86;
        epubScrollEl.scrollTop = Math.max(0, Math.min(epubScrollEl.scrollHeight - epubScrollEl.clientHeight, epubScrollEl.scrollTop + delta));
        syncEpubScrollProgress();
        return;
      }
      if(!rendition) return;
      if(direction > 0) await rendition.next();
      else await rendition.prev();
      setTimeout(syncEpubScrollProgress, 260);
    }

    async function handleEpubWheel(deltaY, event){
      if(mode !== 'epub') return;
      if(event?.preventDefault) event.preventDefault();
      if(epubWheelLock || Math.abs(deltaY) < 18) return;
      epubWheelLock = true;
      await turnEpub(deltaY > 0 ? 1 : -1);
      setTimeout(() => { epubWheelLock = false; }, 420);
    }

    function syncEpubScrollProgress(){
      if(!epubScrollEl) return;
      const max = Math.max(1, epubScrollEl.scrollHeight - epubScrollEl.clientHeight);
      epubPercent = Math.min(1, Math.max(0, epubScrollEl.scrollTop / max));
      if(pageTotalKnown && pageTotal > 0){
        page = Math.min(pageTotal, Math.max(1, Math.ceil(epubPercent * pageTotal)));
      }else{
        page = Math.max(1, Math.ceil(epubPercent * 100));
      }
      updateUi();
      scheduleAutoSave();
    }

    function refreshEpubLayout(){
      if(!epubScrollEl) return;
      const max = Math.max(1, epubScrollEl.scrollHeight - epubScrollEl.clientHeight);
      pageTotal = Math.max(1, Math.ceil(max / Math.max(360, epubScrollEl.clientHeight * .86)));
      pageTotalKnown = true;
      syncEpubScrollProgress();
    }

    function bindEpubPagingGestures(){
      const stage = $('stage');
      if(stage._hasEpubGestures) return;
      stage._hasEpubGestures = true;
      stage.addEventListener('wheel', e => {
        handleEpubWheel(e.deltaY, e);
      }, {passive:false});
      stage.addEventListener('touchstart', e => {
        if(mode !== 'epub') return;
        touchStartY = e.touches[0]?.clientY ?? null;
      }, {passive:true});
      stage.addEventListener('touchend', e => {
        if(mode !== 'epub' || touchStartY === null) return;
        const endY = e.changedTouches[0]?.clientY ?? touchStartY;
        const delta = touchStartY - endY;
        touchStartY = null;
        if(Math.abs(delta) < 36) return;
        if(delta > 0) nextPage();
        else prevPage();
      }, {passive:true});
    }

    function bindEpubContentGestures(view){
      const doc = view?.document;
      if(!doc || doc._readerGesturesBound) return;
      doc._readerGesturesBound = true;
      epubScrollEl = doc.scrollingElement || doc.documentElement || doc.body;
      doc.addEventListener('scroll', () => {
        if(pageTimer) clearTimeout(pageTimer);
        pageTimer = setTimeout(syncEpubScrollProgress, 80);
      }, {passive:true});
      doc.addEventListener('touchstart', e => {
        touchStartY = e.touches[0]?.clientY ?? null;
      }, {passive:true});
      doc.addEventListener('touchend', e => {
        touchStartY = null;
      }, {passive:true});
      setTimeout(syncEpubScrollProgress, 120);
    }

    function scrollToPage(p){
      const stage = $('stage');
      if(mode==='pdf'){
        const el = document.querySelector('.pdf-page[data-page="'+p+'"]');
        if(el) stage.scrollTop = topInStage(el) - 24;
      }else if(mode==='text'){
        const el = $('tp'+p);
        if(el) stage.scrollTop = topInStage(el) - 24;
      }
      if(!stage._hasScrollListener){
        stage._hasScrollListener = true;
        stage.addEventListener('scroll', onUserScroll, {passive:true});
      }
    }

    function wait(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function jumpToInitialPage(){
      suppressAutoSave = true;
      readerReady = false;

      await wait(mode === 'epub' ? 260 : 120);
      const total = Math.max(1, pageTotal || startPage || 1);
      const targetPage = Math.min(total, Math.max(1, startPage || 1));
      page = targetPage;

      if(mode === 'epub'){
        if(epubScrollEl && pageTotalKnown && pageTotal > 1){
          const max = Math.max(0, epubScrollEl.scrollHeight - epubScrollEl.clientHeight);
          epubScrollEl.scrollTop = max * ((targetPage - 1) / Math.max(1, pageTotal - 1));
          syncEpubScrollProgress();
        }
      }else{
        scrollToPage(targetPage);
        if(mode === 'pdf') await renderNearbyPdfPages();
      }

      updateUi();
      await wait(350);
      lastSavedPage = page;
      lastSavedProgress = progress();
      lastSavedAt = Date.now();
      readerReady = true;
      suppressAutoSave = false;
    }

    function goPage(){
      if(mode === 'epub' && !pageTotalKnown){
        updateUi();
        return;
      }
      const next = Math.min(pageTotal, Math.max(1, Number($('pageInput').value)||1));
      page = next;
      if(mode==='epub' && rendition){ rendition.display(next-1); }
      else { scrollToPage(next); }
      updateUi();
      scheduleAutoSave();
    }

    async function nextPage(){
      if(pageTotalKnown && page >= pageTotal) return;
      if(mode==='epub'){
        await turnEpub(1);
        return;
      }
      page++;
      if(mode==='epub' && rendition){ await rendition.next(); }
      else { scrollToPage(page); }
      updateUi();
      scheduleAutoSave();
    }

    async function prevPage(){
      if(mode==='epub'){
        await turnEpub(-1);
        return;
      }
      if(page <= 1) return;
      page--;
      if(mode==='epub' && rendition){ await rendition.prev(); }
      else { scrollToPage(page); }
      updateUi();
      scheduleAutoSave();
    }

    async function zoomIn(){
      if(mode==='pdf'){
        fitMode = false; scale = Math.min(scale+0.25, 4);
        if(pdfDoc) await quickReloadPdf(page);
      }else if(mode==='epub'){
        epubFont = Math.min(epubFont+10, 160);
        applyReaderFontScale(epubFont);
        if(rendition) rendition.themes.fontSize(epubFont+'%');
        setTimeout(refreshEpubLayout, 80);
      }else if(mode==='text'){
        textFont = Math.min(textFont+10, 160);
        applyReaderFontScale(textFont);
        detectCurrentPage();
      }
      updateUi();
    }
    async function zoomOut(){
      if(mode==='pdf'){
        fitMode = false; scale = Math.max(scale-0.25, 0.5);
        if(pdfDoc) await quickReloadPdf(page);
      }else if(mode==='epub'){
        epubFont = Math.max(epubFont-10, 70);
        applyReaderFontScale(epubFont);
        if(rendition) rendition.themes.fontSize(epubFont+'%');
        setTimeout(refreshEpubLayout, 80);
      }else if(mode==='text'){
        textFont = Math.max(textFont-10, 70);
        applyReaderFontScale(textFont);
        detectCurrentPage();
      }
      updateUi();
    }
    async function fitWidth(){
      if(mode==='pdf' && pdfDoc){
        fitMode = true;
        const host = $('stage');
        const avail = Math.max(320, host.clientWidth-56);
        const fp = await pdfDoc.getPage(1);
        scale = Math.min(3.2, Math.max(.8, avail/fp.getViewport({scale:1}).width));
        await quickReloadPdf(page);
        updateUi();
      }
    }

    function toggleNight(){ document.body.classList.toggle('night'); }

    function scheduleAutoSave(){
      if(!readerReady || suppressAutoSave) return;
      if(autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveProgress(false).catch(()=>{});
      }, 900);
    }

    function loginUrl(){
      const current = location.pathname + location.search + location.hash;
      const next = window.top && window.top !== window
        ? '/?reader=' + encodeURIComponent(bookId) + '&page=' + encodeURIComponent(page || startPage || 1)
        : current;
      return '/login?next=' + encodeURIComponent(next);
    }

    function goLogin(){
      const url = loginUrl();
      if(window.top && window.top !== window){
        window.top.location.href = url;
      }else{
        location.href = url;
      }
    }

    async function saveProgress(showTip=true, force=false, overrideProgress=null){
      if(!token){
        if(showTip) goLogin();
        return;
      }
      if(!force && (!readerReady || suppressAutoSave)) return;

      const now = Date.now();
      const currentProgress = overrideProgress !== null ? overrideProgress : progress();

      if(!force && page <= 1 && lastSavedProgress > 1) return;
      if(!force && lastSavedProgress > 1 && currentProgress + 0.1 < lastSavedProgress) return;
      if(
        !force &&
        page === lastSavedPage &&
        Math.round(currentProgress) === Math.round(lastSavedProgress) &&
        now - lastSavedAt < 25000
      ){
        return;
      }

      try{
        const minutes = Math.max(0, Math.round((now - readerEnterAt) / 60000));
        await api('/user/progress/'+bookId, {
          method:'POST',
          body:JSON.stringify({
            current_page:page,
            progress_percent:currentProgress,
            reading_minutes:minutes,
            last_device:'Web Reader'
          })
        });

        lastSavedPage = page;
        lastSavedProgress = currentProgress;
        lastSavedAt = now;
        readerEnterAt = now;

        window.parent?.postMessage({
          type:'reader-progress-saved',
          book_id:Number(bookId),
          current_page:page,
          progress_percent:currentProgress
        }, '*');

        if(showTip) alert('进度已保存：'+Math.round(currentProgress)+'%');
      }catch(e){
        if(showTip) alert('保存失败：'+(e.message || '请稍后重试'));
        throw e;
      }
    }

    window.addEventListener('resize', () => {
      if(mode==='pdf' && fitMode && pdfDoc){
        const host = $('stage');
        const avail = Math.max(320, host.clientWidth-56);
        pdfDoc.getPage(1).then(fp => {
          scale = Math.min(3.2, Math.max(.8, avail/fp.getViewport({scale:1}).width));
          quickReloadPdf(page);
        });
      }
    });

    window.addEventListener('beforeunload', () => {
      if(readerReady && !suppressAutoSave){
        saveProgress(false, false).catch(()=>{});
      }
    });

    init();
  </script>
</body>
