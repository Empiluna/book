<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>在线试读阅读器</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#0f172a;background:#eef2ff}
    body{margin:0;background:radial-gradient(circle at 12% 0,#dbeafe,transparent 35%),radial-gradient(circle at 90% 20%,#ede9fe,transparent 30%),#f8fafc;min-height:100vh}
    .bar{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border-bottom:1px solid rgba(148,163,184,.28)}
    .bar h1{font-size:18px;margin:0}.bar span{font-size:13px;color:#64748b}.tools{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#312e81;color:white;cursor:pointer}.ghost{background:#e2e8f0;color:#334155}.wrap{max-width:1120px;margin:22px auto;padding:0 18px}.paper{background:white;border:1px solid rgba(148,163,184,.26);box-shadow:0 25px 70px rgba(15,23,42,.14);border-radius:24px;min-height:640px;padding:24px;overflow:hidden}.hint{color:#64748b;line-height:1.7}.page{max-width:820px;margin:18px auto;padding:36px;background:#fffaf0;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(120,113,108,.12);font-size:18px;line-height:1.9}.page b{display:block;margin-bottom:12px}.night{background:#020617;color:#dbeafe}.night .paper{background:#0f172a;color:#e2e8f0}.night .page{background:#111827;color:#f8fafc}.night .bar{background:rgba(15,23,42,.82);color:#f8fafc}.night .hint{color:#cbd5e1}canvas{display:block;margin:auto;border-radius:16px;box-shadow:0 20px 50px rgba(15,23,42,.18);background:white}.epubbox{height:680px;border-radius:18px;border:1px solid #e2e8f0;overflow:hidden;background:#fff}.toc{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toc button{background:#eef2ff;color:#3730a3}.progress{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:linear-gradient(90deg,#4f46e5,#06b6d4)}
  </style>
</head>
<body>
  <div class="bar"><div><h1 id="title">在线试读</h1><span id="meta">本地 PDF.js / EPUB.js / 文本分页</span><div class="progress"><div id="prog" style="width:0%"></div></div></div><div class="tools"><button onclick="prevPage()">上一页</button><button onclick="nextPage()">下一页</button><button onclick="zoomIn()">放大</button><button onclick="zoomOut()">缩小</button><button class="ghost" onclick="toggleNight()">夜间</button><button class="ghost" onclick="saveProgress()">保存进度</button></div></div>
  <main class="wrap"><section class="paper"><div id="toc" class="toc"></div><div id="viewer" class="hint">加载阅读器中……</div></section></main>
  <script src="/static/vendor/epub.min.js"></script>
  <script>
    const API='/api/v1'; const params=new URLSearchParams(location.search); const bookId=params.get('book_id')||'1'; let trial=null, mode='text', page=1, scale=1.15, pdfDoc=null, rendition=null, locationsTotal=1;
    const token=localStorage.getItem('token')||'';
    function headers(){return token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
    async function api(path,opts={}){const r=await fetch(API+path,{headers:headers(),...opts}); if(!r.ok) throw new Error(await r.text()); return r.json()}
    function pct(){return Math.min(100,Math.max(1,Math.round((page/(mode==='pdf'?(pdfDoc?.numPages||trial.allowed_pages):trial.allowed_pages))*100)))}
    function updateProg(){document.getElementById('prog').style.width=pct()+'%'; document.getElementById('meta').textContent=`${mode.toUpperCase()} · 第 ${page} 页 · 允许试读 ${trial?.allowed_pages||'-'} 页`}
    async function init(){trial=await api('/ecosystem/trial/'+bookId); document.getElementById('title').textContent=trial.book.title+' · 在线试读'; mode=trial.content_type; if(mode==='pdf'&&trial.pdf_url) return loadPdf(trial.pdf_url); if(mode==='epub'&&trial.epub_url) return loadEpub(trial.epub_url); renderText();}
    async function loadPdf(url){try{const pdfjsLib=await import('/static/vendor/pdf.min.mjs'); pdfjsLib.GlobalWorkerOptions.workerSrc='/static/vendor/pdf.worker.min.mjs'; pdfDoc=await pdfjsLib.getDocument(url).promise; page=1; renderPdf();}catch(e){console.warn(e); renderText('PDF.js加载失败，已切换为文本试读。')}}
    async function renderPdf(){const viewer=document.getElementById('viewer'); viewer.innerHTML='<canvas id="pdfCanvas"></canvas>'; const p=await pdfDoc.getPage(page); const viewport=p.getViewport({scale}); const c=document.getElementById('pdfCanvas'); c.width=viewport.width; c.height=viewport.height; await p.render({canvasContext:c.getContext('2d'),viewport}).promise; updateProg();}
    function loadEpub(url){try{document.getElementById('viewer').innerHTML='<div id="epub" class="epubbox"></div>'; const book=ePub(url); rendition=book.renderTo('epub',{width:'100%',height:'100%'}); rendition.display(); book.ready.then(()=>book.navigation.get()).then(nav=>{document.getElementById('toc').innerHTML=(nav.toc||[]).slice(0,8).map(x=>`<button onclick="rendition.display('${x.href}')">${x.label}</button>`).join('')}); rendition.on('relocated', loc=>{page=loc.start.index+1; locationsTotal=Math.max(loc.end.index+1,locationsTotal); updateProg();}); updateProg();}catch(e){console.warn(e); renderText('EPUB.js加载失败，已切换为文本试读。')}}
    function renderText(msg=''){mode='text'; const pages=trial.pages||[]; document.getElementById('viewer').innerHTML=(msg?`<p class="hint">${msg}</p>`:'')+pages.map(p=>`<section class="page"><b>第 ${p.page} 页</b><p>${p.content}</p></section>`).join(''); updateProg();}
    function nextPage(){ if(mode==='pdf'&&pdfDoc){page=Math.min(page+1,Math.min(pdfDoc.numPages,trial.allowed_pages)); renderPdf();} else if(mode==='epub'&&rendition){rendition.next();} else {page=Math.min(page+1,trial.allowed_pages); window.scrollBy({top:520,behavior:'smooth'}); updateProg();} }
    function prevPage(){ if(mode==='pdf'&&pdfDoc){page=Math.max(page-1,1); renderPdf();} else if(mode==='epub'&&rendition){rendition.prev();} else {page=Math.max(page-1,1); window.scrollBy({top:-520,behavior:'smooth'}); updateProg();} }
    function zoomIn(){scale=Math.min(scale+.15,2.2); if(mode==='pdf')renderPdf();}
    function zoomOut(){scale=Math.max(scale-.15,.7); if(mode==='pdf')renderPdf();}
    function toggleNight(){document.body.classList.toggle('night')}
    async function saveProgress(){try{await api('/user/progress/'+bookId,{method:'POST',body:JSON.stringify({current_page:page,progress_percent:pct(),reading_minutes:12,last_device:'Web Reader'})}); alert('阅读进度已保存：'+pct()+'%')}catch(e){alert('请先登录后保存进度')}}
    init();
  </script>
</body></html>
